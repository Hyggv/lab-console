name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build frontend
        env:
          LAB_API_ORIGIN: ${{ vars.LAB_API_ORIGIN }}
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
